name: External link check

# Advisory weekly sweep of every external link in src/. Local links and
# anchors are enforced by scripts/check_player_guides.py in the build
# workflow; this job never fails and reports to the run summary and one
# rolling issue.

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/links.yml
      - scripts/test_external_links.py
      - src/SUMMARY.md

permissions:
  contents: read
  issues: write

jobs:
  regression:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.27
        with:
          tool: lychee@0.24.2
      - name: Check external-link reporting boundaries
        run: python3 scripts/test_external_links.py

  links:
    if: github.event_name != 'pull_request'
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore link cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      # SUMMARY's empty destinations are intentional mdBook group headings.
      # nav.py validates local destinations; the regression guards against
      # hiding future external destinations in this excluded file.
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --cache --max-cache-age 7d --scheme https --scheme http --max-concurrency 4 --accept 200..=299,403,429 --exclude-path src/Full_Crafting_List.md --exclude-path src/SUMMARY.md 'src/**/*.md' README.md CONTRIBUTING.md
          lycheeVersion: v0.24.2
          fail: false
          output: lychee.md
      - name: Summarize
        run: cat lychee.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the broken-links issue
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --state open --search 'Broken external links in:title' --json number,title --jq '[.[] | select(.title == "Broken external links")][0].number')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file lychee.md
            echo "Updated issue #$number" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "Broken external links" --body-file lychee.md
          fi
