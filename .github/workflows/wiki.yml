name: Build & Deploy mdBook Site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the PR merge commit and its parents, for the pinned-page diff
      - uses: actions/checkout@v7
        with:
          repository: Civ13/Civ13
          path: civ13
          sparse-checkout: code/modules/reagents/reagent_containers/food
          sparse-checkout-cone-mode: true
      - name: Install mdBook & plugins
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: mdbook@0.4.52,mdbook-admonish@1.14.0,mdbook-linkcheck@0.7.7,mdbook-emojicodes@0.3.0
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: List changed pages that Player Help pins
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_pinned_changes.py HEAD^1 HEAD
      - name: Build with mdBook
        run: |
          python3 scripts/check_tools.py
          python3 scripts/nav.py
          python3 scripts/check_assets.py
          python3 scripts/test_previews.py
          python3 scripts/build.py
          python3 scripts/check_player_guides.py
      - name: Compare Food Decay Times with the game source (advisory)
        run: python3 scripts/check_decay_times.py --civ13 civ13
      - name: Upload reviewed HTML
        uses: actions/upload-artifact@v4
        with:
          name: wiki-html-${{ github.sha }}
          path: ./book/html
          retention-days: 7
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  markdownlint:
    # Advisory: reports style problems in the job log without failing the PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v19
        continue-on-error: true # advisory: findings stay in the log, the job stays green
        with:
          globs: |
            src/**/*.md
            !src/Full_Crafting_List.md
            !src/Food_Decay_Times.md
